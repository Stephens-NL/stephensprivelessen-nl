services:
  stephensprivelessen-nl:
    build: .
    container_name: stephensprivelessen-nl
    restart: unless-stopped
    ports:
      - "4302:4302"
    # PORTAAL_INTERNAL_URL + INTERNAL_API_KEY record a lead in the portaal's
    # intake_submissions, which is what vps-bot's crm_web_intake_review job polls
    # (every 5 min) to send the Telegram review card with the Accept button.
    # INTERNAL_API_KEY must match the value in the privelessen-portaal container
    # or the endpoint returns 401 — it is server-side only, never in a bundle.
    #
    # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are now the FALLBACK lead alert: the
    # plain message is sent only when the intake record failed, so one lead is
    # one notification. Without any of these four, app/api/contact/route.ts
    # returns ok:true with recorded:false and notified:false — the student sees
    # success and no lead reaches Stephen anywhere.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4302
      - HOSTNAME=0.0.0.0
      - PORTAAL_INTERNAL_URL=http://privelessen-portaal:4306
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4302/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    # data-network is where privelessen-portaal lives; without joining it the
    # container cannot resolve the hostname above at all. Keeping the default
    # network too so nginx on the host keeps reaching the published port.
    networks:
      - default
      - data-network

networks:
  data-network:
    external: true
