services:
  stephensprivelessen-nl:
    build: .
    container_name: stephensprivelessen-nl
    restart: unless-stopped
    ports:
      - "4302:4302"
    # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID for the contact-form lead alert.
    # Without them app/api/contact/route.ts returns ok:true with notified:false —
    # the student sees success and no lead notification is sent anywhere.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4302
      - HOSTNAME=0.0.0.0
      - PLATFORM_API_URL=http://host.docker.internal:8082
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4302/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
